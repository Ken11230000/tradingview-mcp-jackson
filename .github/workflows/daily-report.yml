name: 📊 Daily Pre-Market Report

on:
  schedule:
    # 12:30 UTC = 8:30am EST = 1:30pm BST (Mon–Fri)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab (useful if a run is missed)

permissions:
  contents: write   # needed to commit trade journal back to repo

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily report & send email
        run: node scripts/daily-report.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

      - name: Commit updated trade journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f scripts/.trade-journal.json ]; then
            git add scripts/.trade-journal.json
            if ! git diff --cached --quiet; then
              git commit -m "Update trade journal — $(date -u +%Y-%m-%d)"
              git push
            fi
          fi
